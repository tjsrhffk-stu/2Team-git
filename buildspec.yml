version: 0.2

phases:
  build:
    commands:
      - echo "Packaging LocalEats deployment bundle"
      - echo "Branch: ${CODEBUILD_SOURCE_VERSION:-unknown}"

artifacts:
  files:
    - appspec.yml
    - manage.py
    - requirements.txt
    - .env.example
    - config/**/*
    - core/**/*
    - favorites/**/*
    - restaurants/**/*
    - reviews/**/*
    - static/**/*
    - templates/**/*
    - users/**/*
    - scripts/**/*
  discard-paths: no