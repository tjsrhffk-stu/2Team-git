# =============================================================================
# LocalEats - Apache + mod_wsgi 설정 파일
# =============================================================================
# 사용법:
#   sudo cp apache.conf /etc/apache2/sites-available/localeats.conf
#   sudo a2ensite localeats
#   sudo a2enmod wsgi headers ssl rewrite
#   sudo systemctl reload apache2
#
# 필수 Apache 모듈:
#   mod_wsgi   - Django WSGI 연동
#   mod_headers - X-Forwarded-Proto 헤더 추가 (Django HTTPS 인식)
#   mod_ssl    - HTTPS 지원
#   mod_rewrite - HTTP → HTTPS 리다이렉트
#
# mod_wsgi 설치 (Ubuntu/Debian):
#   sudo apt install libapache2-mod-wsgi-python3
# =============================================================================

# ── HTTP → HTTPS 리다이렉트 ──────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName yourdomain.com
    ServerAlias www.yourdomain.com

    RewriteEngine On
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

# ── HTTPS (메인) VirtualHost ─────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName yourdomain.com
    ServerAlias www.yourdomain.com

    # ── SSL 인증서 ────────────────────────────────────────────────────────────
    SSLEngine On
    SSLCertificateFile    /etc/ssl/certs/yourdomain.crt
    SSLCertificateKeyFile /etc/ssl/private/yourdomain.key
    # Let's Encrypt 사용 시:
    # SSLCertificateFile    /etc/letsencrypt/live/yourdomain.com/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/yourdomain.com/privkey.pem

    # ── Django가 HTTPS 요청을 올바르게 인식하도록 헤더 추가 ──────────────────
    # settings.py 의 SECURE_PROXY_SSL_HEADER = ('HTTP_X_FORWARDED_PROTO', 'https') 와 대응
    RequestHeader set X-Forwarded-Proto "https"

    # ── mod_wsgi 설정 ─────────────────────────────────────────────────────────
    # python-home: 가상환경 경로 (실제 경로로 수정 필요)
    # python-path: Django 프로젝트 루트 (manage.py 위치)
    WSGIDaemonProcess localeats \
        python-home=/var/www/localeats/.venv \
        python-path=/var/www/localeats \
        processes=2 \
        threads=4 \
        display-name=%{GROUP}

    WSGIProcessGroup localeats

    # config/wsgi.py 의 application 객체를 가리킴
    WSGIScriptAlias / /var/www/localeats/config/wsgi.py

    # Django 가 Authorization 헤더를 읽을 수 있도록 허용 (API 토큰 등)
    WSGIPassAuthorization On

    <Directory /var/www/localeats/config>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # ── 정적 파일 (Django collectstatic 결과물) ───────────────────────────────
    # python manage.py collectstatic 실행 후 staticfiles/ 디렉터리가 생성됨
    Alias /static/ /var/www/localeats/staticfiles/

    <Directory /var/www/localeats/staticfiles>
        Require all granted
        Options -Indexes
    </Directory>

    # ── 미디어 파일 (사용자 업로드) ───────────────────────────────────────────
    # 로컬 환경: /var/www/localeats/media/
    # EFS 마운트 환경: MEDIA_ROOT .env 변수로 지정한 경로와 일치시킬 것
    Alias /media/ /var/www/localeats/media/

    <Directory /var/www/localeats/media>
        Require all granted
        Options -Indexes
    </Directory>

    # ── 로그 ─────────────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/localeats_error.log
    CustomLog ${APACHE_LOG_DIR}/localeats_access.log combined
    LogLevel warn

</VirtualHost>
