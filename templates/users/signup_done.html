{% extends 'base.html' %}
{% block title %}회원가입 완료 — LocalEats{% endblock %}
{% block content %}
<div style="max-width:480px;margin:80px auto;text-align:center;padding:0 24px">
  <div style="margin-bottom:24px;"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
  <h1 style="font-size:32px;font-weight:700;margin-bottom:12px">이메일을 확인해주세요!</h1>
  <p style="color:var(--text2);font-size:16px;line-height:1.7;margin-bottom:32px">
    <strong>{{ email }}</strong>로 인증 메일을 보냈어요.<br>
    메일함을 확인하고 링크를 클릭해주세요!
  </p>
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;font-size:14px;color:var(--text2);margin-bottom:28px">
    인증 링크는 <strong>24시간</strong> 후에 만료돼요<br>
    스팸 메일함도 확인해보세요
  </div>
  <a href="/users/login/" style="background:var(--accent);color:#fff;padding:13px 28px;border-radius:12px;text-decoration:none;font-weight:600;font-size:15px">로그인 페이지로 →</a>
</div>
{% endblock %}
